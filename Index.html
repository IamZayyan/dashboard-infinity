<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashBoard INFINITY</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
        }
        h1 {
            text-align: center;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .panel {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        .panel h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
        }
        /* Quick Links */
        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .links a {
            background-color: var(--accent);
            color: #0f172a;
            padding: 10px;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .links a:hover {
            background-color: #7dd3fc;
        }
        /* Video Placeholders */
        .video-box {
            width: 100%;
            height: 200px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: #64748b;
            margin-bottom: 10px;
        }
        /* Chat Box */
        .chat-messages {
            height: 150px;
            background-color: #0f172a;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 0.9em;
        }
        .chat-input {
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex-grow: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: #334155;
            color: white;
        }
        .chat-input button {
            padding: 10px 15px;
            background-color: var(--accent);
            border: none;
            border-radius: 6px;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>DashBoard INFINITY</h1>

    <div class="grid-container">
        
        <!-- Quick Links Panel -->
        <div class="panel">
            <h2>Quick Links</h2>
            <div class="links">
                <a href="https://google.com" target="_blank">Google</a>
                <a href="https://canvas.instructure.com" target="_blank">Canvas / School</a>
                <a href="https://mathway.com" target="_blank">Mathway</a>
            </div>
        </div>

        <!-- Chat Panel -->
        <div class="panel">
            <h2>Infinity Chat</h2>
            <div class="chat-messages" id="chatBox">
                <div><em>Welcome to the chat! (Messages disappear on refresh until we add a database)</em></div>
            </div>
            <div class="chat-input">
                <input type="text" id="msgInput" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

        <!-- Streams Panel -->
        <div class="panel">
            <h2>Streams</h2>
            <div class="video-box">
                [Sports Stream Placeholder]
            </div>
            <div class="video-box">
                [Movie Stream Placeholder]
            </div>
        </div>

    </div>

    <script>
        // Simple script to make the chat UI work temporarily
        function sendMessage() {
            const input = document.getElementById('msgInput');
            const chatBox = document.getElementById('chatBox');
            if (input.value.trim() !== '') {
                const newMsg = document.createElement('div');
                newMsg.textContent = "You: " + input.value;
                chatBox.appendChild(newMsg);
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
